version: '3.8'

services:
  absa-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bertimbau-absa:latest
    container_name: bertimbau-absa-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - LOG_FULL_TEXT=false
      - MAX_TEXT_LENGTH=1024
      - MAX_BATCH_SIZE=32
      - MODEL_PATH=/app/artifacts
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
