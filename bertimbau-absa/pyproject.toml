[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bertimbau-absa"
version = "0.1.0"
description = "BERTimbau-based Aspect-Based Sentiment Analysis (ABSA) pipeline for Brazilian Portuguese food reviews."
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "datasets>=2.14",
    "evaluate",
    "scikit-learn>=1.3",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    "structlog",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
